name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Install dependencies
      run: git submodule update --init --recursive
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Verify 6.10 IPC and storage contracts
      shell: pwsh
      run: ./scripts/verify-stabilization.ps1 -Baseline v6.8.0
    - name: Run JVM tests
      run: ./gradlew :app:testDebugUnitTest :engine:testDebugUnitTest
    - name: Assemble all gated APKs
      run: >-
        ./gradlew
        :app:assembleDebug
        :app:assembleRelease
        :app:assembleAndroidTest
        :engine:assembleAndroidTest
    - name: Run debug lint
      run: ./gradlew lintDebug
    - name: Verify packaged APKs contain no retired IPC names
      shell: bash
      run: |
        set -euo pipefail
        apks=(
          app/build/outputs/apk/debug/GodMode-Pro-v*-debug.apk
          app/build/outputs/apk/release/GodMode-Pro-*-release*.apk
          app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          engine/build/outputs/apk/androidTest/debug/engine-debug-androidTest.apk
        )
        for apk in "${apks[@]}"; do
          test -f "$apk" || { echo "Required APK is missing: $apk" >&2; exit 1; }
          if unzip -p "$apk" classes*.dex 2>/dev/null | strings | grep -Eq 'IGodModeManager|com/kaisar/xposed/godmode/IObserver|OP_ONE_SHOT|finishAssetWrite|getProtocolDescriptor|getProtocolVersion|AssetWriteSession|openAssetWrite|discardAssetWrite|global-edit-mutation-v1'; then
            echo "Retired IPC symbol found in $apk" >&2
            exit 1
          fi
        done

  instrumentation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Install dependencies
      run: git submodule update --init --recursive
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Enable KVM access
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run API 35 instrumentation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: default
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: sh scripts/run-connected-instrumentation.sh
    - name: Upload instrumentation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumentation-diagnostics
        path: |
          instrumentation-logcat.txt
          app/build/outputs/androidTest-results/connected/
          app/build/reports/androidTests/connected/
          engine/build/outputs/androidTest-results/connected/
          engine/build/reports/androidTests/connected/
        if-no-files-found: warn
