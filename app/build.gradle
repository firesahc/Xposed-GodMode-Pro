plugins {
    alias libs.plugins.android.application
    alias libs.plugins.navigation.safe.args
}

android {
    namespace 'com.kaisar.xposed.godmode'
    compileSdk 35
    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }
    defaultConfig {
        applicationId "com.viewblocker.jrsen"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 47
        versionName "6.4.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    androidResources {
        additionalParameters("--allow-reserved-package-id", "--package-id", "0x95")
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':engine')
    implementation project(path: ':libxservicemanager')
    implementation libs.androidx.constraintlayout
    implementation libs.bundles.navigation
    implementation libs.androidx.appcompat
    implementation libs.androidx.viewpager2
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    compileOnly files("${rootProject.projectDir}/libs/xposed-api-89.jar")
    implementation libs.gson
    implementation libs.material
    implementation libs.glide
    implementation libs.rikka.insets
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    annotationProcessor libs.glide.compiler
}
