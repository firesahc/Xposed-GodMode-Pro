// =========================================================================
// engine 模块 — 规则引擎 (com.kaisar.xposed.godmode.engine)
// Android Library, compileSdk 35
// 职责: 视图匹配、规则应用、规则持久化、事件系统、线程池、通用工具
// 与 app 模块通过共享 POJO (不依赖 Parcelable) 解耦
// =========================================================================
plugins {
    alias libs.plugins.android.library
}

android {
    namespace 'com.kaisar.xposed.godmode.engine'
    compileSdk 35

    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 35

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    testOptions {
        // engine 为纯逻辑模块：android.* stub（如 Log.getStackTraceString）按默认值放行，
        // 使 TextMatcher/Logger 协同路径可在 JVM 上完整测试。
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.annotation
    coreLibraryDesugaring libs.desugar
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
}
