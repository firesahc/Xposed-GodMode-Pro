plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaisar.xposed.godmode.testtarget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.viewblocker.jrsen.testtarget'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
        // This host intentionally matches the production project's API 35 contract.
        disable 'OldTargetApi'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
